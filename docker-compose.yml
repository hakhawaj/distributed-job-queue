services:
  dev:
    image: mcr.microsoft.com/devcontainers/typescript-node:20
    volumes:
      - .:/workspace:cached
    working_dir: /workspace
    command: sleep infinity
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://jobqueue:jobqueue@postgres:5432/job_queue_dev

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jobqueue
      POSTGRES_PASSWORD: jobqueue
      POSTGRES_DB: job_queue_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    image: mcr.microsoft.com/devcontainers/typescript-node:20
    volumes:
      - .:/workspace:cached
    working_dir: /workspace
    command: npm run dev:api
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://jobqueue:jobqueue@postgres:5432/job_queue_dev
      PORT: 3000
    ports:
      - "3000:3000"

  worker:
    image: mcr.microsoft.com/devcontainers/typescript-node:20
    volumes:
      - .:/workspace:cached
    working_dir: /workspace
    command: npm run dev:worker
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://jobqueue:jobqueue@postgres:5432/job_queue_dev

volumes:
  postgres_data:
